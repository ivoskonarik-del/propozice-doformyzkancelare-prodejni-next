ervu na dovolenou, nemoc nebo šílený týden v práci. Těch 14 dní máš v ceně u všech variant. Přílohy, recepty a tabulky si během té doby stáhni, ty ti pak zůstanou napořád."}},{"@type":"Question","name":"Nejím maso / mám alergii. Poradím si s jídlem?","acceptedAnswer":{"@type":"Answer","text":"U Diamondu jednoznačně — jídelníček píšu ručně přímo tobě, takže se do něj tvoje omezení promítnou. U Goldu dostaneš 12 hotových receptů; jsou univerzální a jde je zaměnit, ale nejsou stavěné na míru. Silver je jen tréninkový, jídlo v něm není vůbec."}},{"@type":"Question","name":"Co když to za 30 dní nestihnu odcvičit?","acceptedAnswer":{"@type":"Answer","text":"Proto máš v ceně 14 dní přístupu navíc, celkem tedy 44 dní. Přijde dovolená, chřipka nebo šílený týden v práci — nic se neděje, dojedeš to potom."}},{"@type":"Question","name":"Je mi přes padesát. Není na tohle pozdě?","acceptedAnswer":{"@type":"Answer","text":"Není. Lehčí varianty jsou stavěné tak, aby zvládnutelné byly i s vyšší vahou a nezničily ti klouby. Jestli máš zdravotní komplikace, projdi to nejdřív s doktorem."}},{"@type":"Question","name":"Jak přesně funguje garance?","acceptedAnswer":{"@type":"Answer","text":"Máš 7 dní od chvíle, kdy dostaneš přístup. Když ti to nesedne, napiš na doformy@efefit.cz a vrátím ti celou částku. Nemusíš nic dokládat ani vysvětlovat a stažené materiály si necháš. U Diamondu se peníze za jídelníček na míru nevrací — je psaný ručně přímo tobě. Místo toho ti ho během programu upravím, kdykoliv ti nebude sedět."}}]}]}</script><div style="font-family:system-ui,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif,&quot;Apple Color Emoji&quot;,&quot;Segoe UI Emoji&quot;;height:100vh;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center"><div><style>body{color:#000;background:#fff;margin:0}.next-error-h1{border-right:1px solid rgba(0,0,0,.3)}@media (prefers-color-scheme:dark){body{color:#fff;background:#000}.next-error-h1{border-right:1px solid
